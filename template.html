<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>San Andreas Roleplay - Multiplayer SAMP</title>
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/landing/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/landing/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/landing/favicon-16x16.png"
    />
    <link rel="manifest" href="/landing/site.webmanifest" />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://unpkg.com/primeicons/primeicons.css" />
    <link rel="stylesheet" href="/landing/app.css" />
    <link rel="stylesheet" href="/landing/template-styles.css" />
  </head>

  <body>
    <!-- Header Include -->
    <div id="header-include"></div>

    <!-- Main Content -->
    <main
      class="min-h-screen bg-fixed bg-center bg-repeat-x bg-[length:80%]"
      style="
        background-image: url('/landing/images/gangtags.png');
        background-color: #1a1800;
      "
    >
      <div class="relative w-full">
        <!-- Hero Section Include -->
        <div id="hero-include"></div>

        <div class="lg:top-full block relative max-w-[1200px] mx-auto">
          <!-- Download Section Include -->
          <div id="download-include"></div>
          
          <div class="pt-6">
            <div class="flex flex-col gap-y-32 gap-x-12 items-center">
              <!-- Emergency Services Include -->
              <div id="emergency-include"></div>

              <!-- Content Sections Include -->
              <div id="content-include"></div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <!-- Metrics and Events Divs -->
    <div
      id="globalMetricsDiv"
      style="
        background: #222;
        color: #fcaf17;
        padding: 1rem;
        margin: 1rem 0;
        border-radius: 8px;
        font-family: monospace;
        white-space: pre-wrap;
      "
    ></div>
    <div
      id="eventsDiv"
      style="
        background: #222;
        color: #fcaf17;
        padding: 1rem;
        margin: 1rem 0;
        border-radius: 8px;
        font-family: monospace;
        white-space: pre-wrap;
      "
    ></div>
    
    <!-- Footer Include -->
    <div id="footer-include"></div>
    <!-- Scripts -->
    <script>
      console.log(
        "%cBuscamos desarrolladores como tú, demuestra tu talento en el repositorio de GitHub :)",
        "background: #fcaf17; color: white; padding-left: 5px; padding-right: 5px; font-size: 20px;"
      );
    </script>
    
    <!-- Load modular JavaScript -->
    <script src="/landing/template-includes.js"></script>
    <script src="/landing/api.js"></script>
  </body>
</html>
