<!-- TEMPLATE HEADER -->
<header

        </a>

          <span class="relative">
            Discord
            <span></span>
          </span>

          <span class="relative">
            PCU
            <span></span>
          </span>
        </a>
      </li>

    <a
      class="px-6 py-2 text-md font-bold rounded-lg transition-all duration-300 hover:scale-105 border-2 border-[#FCAF17] text-[#FCAF17] hover:bg-[#FCAF17] hover:text-black uppercase"

  <div

    class="lg:hidden fixed top-16 left-0 w-full bg-black/95 transform -translate-x-full transition-transform duration-300 ease-in-out z-50"

      <li class="w-full text-center">
        <a
          href="https://forum.sarp.es"

          href="samp://play.sarp.es:7777"

          JUGAR AHORA
